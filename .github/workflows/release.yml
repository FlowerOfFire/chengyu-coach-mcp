name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/chengyu-coach-mcp/
    permissions:
      id-token: write # OIDC，供 PyPI Trusted Publishing 使用
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, re, sys

          tag = os.environ["TAG"].removeprefix("v")
          pyproject = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          init = pathlib.Path("src/chengyu_coach_mcp/__init__.py").read_text(encoding="utf-8")
          py_ver = re.search(r'^version = "([^"]+)"', pyproject, re.M).group(1)
          init_ver = re.search(r'__version__ = "([^"]+)"', init).group(1)
          print(f"tag={tag} pyproject={py_ver} __init__={init_ver}")
          if not (tag == py_ver == init_ver):
              sys.exit("::error::三处版本号不一致，拒绝发布")
          PY

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check artifacts
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
